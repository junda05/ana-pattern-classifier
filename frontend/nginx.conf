# nginx server for the ANA Pattern Classifier single-page app.
#
# Installed as /etc/nginx/templates/default.conf.template: at start-up the nginx
# image substitutes environment variables (here only ${API_ORIGIN}) and writes
# /etc/nginx/conf.d/default.conf. API_ORIGIN must be the scheme://host:port of
# REACT_APP_API_BASE_URL so the Content-Security-Policy allows the API calls,
# e.g. `docker run -e API_ORIGIN=https://api.example.com ...`.

# Hashed build assets never change; everything else (index.html, manifest) is revalidated.
map $uri $ana_cache_control {
    ~^/static/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers (declared once here so every location inherits them)
    add_header Cache-Control $ana_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # - script-src 'self': the build is made with INLINE_RUNTIME_CHUNK=false (no inline scripts)
    # - style-src 'unsafe-inline': the modal keyframes <style> element (React style props go
    #   through the CSSOM and need no exception)
    # - img-src blob:/data:: API images are fetched with the auth header and shown as blob URLs;
    #   select arrows are data: SVGs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing hashed assets are real 404s, not the SPA shell
    location /static/ {
        try_files $uri =404;
    }

    # Client-side routes (e.g. /dashboard/home) fall back to the SPA shell
    location / {
        try_files $uri /index.html;
    }
}
