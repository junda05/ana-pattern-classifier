[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Third-party: starlette's TestClient still references a deprecated anyio alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
